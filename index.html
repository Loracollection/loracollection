<!-- ================= CARD PAYMENT ================= -->

<section id="card-payment" class="card-payment-section">

    <h2 class="section-title">
        پرداخت کارت‌به‌کارت
    </h2>

    <div class="card-payment-box">

        <p class="card-payment-text">
            لطفاً مبلغ سفارش را به شماره کارت زیر واریز کرده و
            تصویر رسید پرداخت را در همین بخش بارگذاری نمایید.
        </p>

        <div class="bank-card">

            <span class="bank-label">
                شماره کارت
            </span>

            <strong class="card-number" id="cardNumber">
                0000 0000 0000 0000
            </strong>

            <span class="card-owner">
                به نام: لورا کالکشن
            </span>

        </div>

        <div class="payment-form">

            <div class="form-row">

                <label for="paymentAmount">
                    مبلغ واریزی
                </label>

                <input
                    id="paymentAmount"
                    type="text"
                    inputmode="numeric"
                    placeholder="مبلغ را به تومان وارد کنید"
                >

            </div>

            <div class="form-row">

                <label for="paymentReceipt">
                    تصویر رسید واریز
                </label>

                <input
                    id="paymentReceipt"
                    type="file"
                    accept="image/*"
                >

            </div>

            <button
                type="button"
                class="payment-submit"
                id="paymentSubmit">

                ثبت رسید پرداخت

            </button>

            <div
                id="paymentMessage"
                class="payment-message">
            </div>

        </div>

    </div>

</section>


<style>

.card-payment-section{
    background:#fff7f9;
}

.card-payment-box{
    max-width:650px;
    margin:auto;
    background:#fff;
    border:1px solid #efd9e1;
    padding:30px;
}

.card-payment-text{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-bottom:22px;
}

.bank-card{
    padding:25px 20px;
    background:#fff8fa;
    border:1px solid #efd9e1;
    text-align:center;
    margin-bottom:25px;
}

.bank-label{
    display:block;
    color:#b76c84;
    font-size:12px;
    margin-bottom:8px;
}

.card-number{
    display:block;
    direction:ltr;
    font-family:Georgia,serif;
    font-size:22px;
    letter-spacing:2px;
    color:#222;
    margin-bottom:10px;
}

.card-owner{
    font-size:12px;
    color:#777;
}

.payment-submit{
    width:100%;
    border:0;
    background:#222;
    color:#fff;
    padding:12px;
    font-size:13px;
}

.payment-message{
    text-align:center;
    margin-top:12px;
    color:#b76c84;
    font-size:12px;
}

@media(max-width:600px){

    .card-payment-box{
        padding:20px 15px;
    }

    .card-number{
        font-size:17px;
        letter-spacing:1px;
    }

}

</style>


<script>

document.addEventListener("DOMContentLoaded",function(){

    const paymentSubmit =
        document.getElementById("paymentSubmit");

    if(!paymentSubmit)return;

    paymentSubmit.addEventListener("click",function(){

        const amount =
            document.getElementById("paymentAmount").value.trim();

        const receipt =
            document.getElementById("paymentReceipt").files[0];

        const message =
            document.getElementById("paymentMessage");

        if(!amount){

            message.textContent =
                "لطفاً مبلغ واریزی را وارد کنید.";

            return;
        }

        if(!receipt){

            message.textContent =
                "لطفاً تصویر رسید واریز را انتخاب کنید.";

            return;
        }

        message.textContent =
            "رسید انتخاب شد. پس از بررسی پرداخت، سفارش شما تأیید خواهد شد.";

    });

});

    </script>
