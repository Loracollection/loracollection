<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LORA COLLECTION</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#fff;
    color:#292629;
    font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */

header{
    background:#fff;
    border-bottom:1px solid #f3e3e9;
    padding:28px 20px 20px;
    text-align:center;
}

/* LOGO */

.logo{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
}

/* علامت اصلی */

.logo-mark{
    position:relative;
    width:145px;
    height:125px;
}

/* L بزرگ مشکی */

.l-vertical{
    position:absolute;
    left:55px;
    top:5px;
    width:5px;
    height:92px;
    background:#222;
}

.l-horizontal{
    position:absolute;
    left:55px;
    top:92px;
    width:68px;
    height:5px;
    background:#222;
}

/* L صورتی دست نویس
   انتهای L روی خط افقی قرار می گیرد */

.pink-l{
    position:absolute;
    left:67px;
    top:24px;
    color:#d28da3;
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:68px;
    line-height:1;
    font-weight:normal;
    transform:rotate(-5deg);
}

/* گل ظریف کنار L */

.flower{
    position:absolute;
    left:30px;
    top:48px;
    width:38px;
    height:38px;
}

.petal{
    position:absolute;
    width:13px;
    height:22px;
    border:1.5px solid #d28da3;
    border-radius:80% 20% 80% 20%;
}

.p1{
    left:12px;
    top:0;
    transform:rotate(0deg);
}

.p2{
    left:23px;
    top:9px;
    transform:rotate(72deg);
}

.p3{
    left:19px;
    top:21px;
    transform:rotate(144deg);
}

.p4{
    left:5px;
    top:21px;
    transform:rotate(216deg);
}

.p5{
    left:0;
    top:9px;
    transform:rotate(288deg);
}

.flower-center{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#d28da3;
    left:16px;
    top:16px;
}

/* برگ ظریف */

.leaf{
    position:absolute;
    left:27px;
    top:77px;
    width:15px;
    height:28px;
    border:1.5px solid #d28da3;
    border-radius:100% 0 100% 0;
    transform:rotate(25deg);
}

.leaf-line{
    position:absolute;
    left:34px;
    top:79px;
    width:1px;
    height:25px;
    background:#d28da3;
    transform:rotate(25deg);
}

/* نوشته */

.brand-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    letter-spacing:7px;
    color:#222;
}

.brand-sub{
    font-family:Georgia,"Times New Roman",serif;
    font-size:11px;
    letter-spacing:5px;
    color:#d28da3;
    margin-top:6px;
}

/* پاپیون */

.bow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    margin-top:10px;
}

.bow-left,
.bow-right{
    width:17px;
    height:11px;
    border:2px solid #d28da3;
}

.bow-left{
    border-radius:80% 20% 50% 50%;
    transform:rotate(18deg);
}

.bow-right{
    border-radius:20% 80% 50% 50%;
    transform:rotate(-18deg);
}

.bow-center{
    width:7px;
    height:7px;
    background:#d28da3;
    border-radius:50%;
}

/* MENU */

nav{
    margin-top:24px;
}

nav a{
    text-decoration:none;
    color:#444;
    font-size:13px;
    margin:0 12px;
}

nav a:hover{
    color:#d28da3;
}

.hero{
