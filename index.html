<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#fff;
    color:#292629;
    font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */
header{
    background:#fff;
    border-bottom:1px solid #f2dfe6;
    padding:28px 15px 20px;
    text-align:center;
}

/* LOGO */
.logo{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* علامت L */
.logo-symbol{
    position:relative;
    width:190px;
    height:150px;
    margin:auto;
}

/* L بزرگ مشکی */
.black-l-vertical{
    position:absolute;
    left:82px;
    top:5px;
    width:5px;
    height:112px;
    background:#222;
}

.black-l-horizontal{
    position:absolute;
    left:82px;
    top:112px;
    width:78px;
    height:5px;
    background:#222;
}

/* L صورتی
   پایین‌تر آمده و به خط افقی L مشکی می‌رسد */
.pink-l{
    position:absolute;
    left:91px;
    top:48px;
    color:#d18ba1;
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:78px;
    font-weight:normal;
    line-height:1;
    transform:rotate(-8deg);
    z-index:4;
}

/* ساقه صورتی که از بالای L به سمت چپ می‌رود */
.pink-stem{
    position:absolute;
    left:35px;
    top:40px;
    width:65px;
    height:2px;
    background:#d18ba1;
    transform:rotate(-28deg);
    transform-origin:right center;
    z-index:3;
}

/* برگ‌های شاخه
   حالت برعکس 🌿 */
