<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>مدیریت LORA COLLECTION</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff5f7;
  color:#333;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  background:white;
  width:400px;
  max-width:100%;
  padding:35px;
  border-radius:25px;
  box-shadow:0 15px 50px #0001;
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo strong{
  font-family:Georgia,serif;
  font-size:32px;
  letter-spacing:5px;
}

.logo span{
  display:block;
  color:#d8899e;
  letter-spacing:4px;
  font-size:12px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ead6dc;
  border-radius:10px;
  margin-top:7px;
  font-family:inherit;
}

label{
  display:block;
  margin-top:15px;
  font-size:13px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
  font-family:inherit;
}

.primary{
  background:#333;
  color:#fff;
}

.pink{
  background:#e5a0b5;
  color:#fff;
}

.danger{
  background:#d9536f;
  color:#fff;
}

.dashboard{
  display:none;
}

header{
  background:#fff;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #f0dce2;
}

header strong{
  font-family:Georgia,serif;
  letter-spacing:4px;
}

.container{
  max-width:1250px;
  margin:30px auto;
  padding:0 20px;
}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.tab{
  background:white;
}

.tab.active{
  background:#333;
  color:#fff;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:right;
}

.status{
  padding:5px 9px;
  border-radius:10px;
  background:#fff0f4;
}

.receipt{
  max-width:120px;
  max-height:120px;
  border-radius:10px;
}

.products-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.product{
  border:1px solid #eee;
  padding:12px;
  border-radius:15px;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

@media(max-width:700px){
  .products-list{
    grid-template-columns:1fr;
  }

  table{
    font-size:11px;
  }
}

</style>
</head>

<body>

<!-- LOGIN -->

<section id="login" class="login">

  <div class="login-box">

    <div class="logo">
      <strong>LORA</strong>
      <span>COLLECTION</span>
    </div>

    <h3>ورود مدیر</h3>

    <label>ایمیل مدیر</label>
    <input id="email" type="email">

    <label>رمز عبور</label>
    <input id="password" type="password">

    <br><br>

    <button class="primary" style="width:100%" onclick="login()">
      ورود به پنل
    </button>

    <p id="loginError"></p>

  </div>

</section>

<!-- DASHBOARD -->

<section id="dashboard" class="dashboard">

<header>

  <strong>LORA COLLECTION — ADMIN</strong>

  <button class="danger" onclick="logout()">
    خروج
  </button>

</header>

<div class="container">

  <div class="tabs">

    <button class="tab active" onclick="showTab('orders',this)">
      📦 سفارش‌ها
    </button>

    <button class="tab" onclick="showTab('products',this)">
      👗 محصولات
    </button>

    <button class="tab" onclick="showTab('add',this)">
      ➕ افزودن محصول
    </button>

  </div>

  <!-- ORDERS -->

  <div id="orders" class="panel active">

    <div class="box">

      <h2>سفارش‌ها</h2>

      <div style="overflow:auto">

        <table>

          <thead>
            <tr>
              <th>شماره</th>
              <th>مشتری</th>
              <th>تلفن</th>
              <th>مبلغ</th>
              <th>وضعیت</th>
              <th>رسید</th>
              <th>عملیات</th>
            </tr>
          </thead>

          <tbody id="ordersTable"></tbody>

        </table>

      </div>

    </div>

  </div>

  <!-- PRODUCTS -->

  <div id="products" class="panel">

    <div class="box">

      <h2>محصولات</h2>

      <div id="productsList" class="products-list"></div>

    </div>

  </div>

  <!-- ADD PRODUCT -->

  <div id="add" class="panel">

    <div class="box">

      <h2>افزودن محصول</h2>

      <label>نام محصول</label>
      <input id="pName">

      <label>دسته‌بندی</label>
      <select id="pCategory">
        <option>لباس زنانه</option>
        <option>کیف و کفش</option>
        <option>اکسسوری</option>
        <option>آرایشی و بهداشتی</option>
        <option>عطر و ادکلن</option>
      </select>

      <label>قیمت</label>
      <input id="pPrice" type="number">

      <label>قیمت قبلی</label>
      <input id="pOldPrice" type="number">

      <label>موجودی</label>
      <input id="pStock" type="number">

      <label>توضیحات</label>
      <textarea id="pDescription"></textarea>

      <label>لینک عکس محصول</label>
      <input id="pImage">

      <br><br>

      <label>
        <input id="pNew" type="checkbox" style="width:auto">
        محصول جدید
      </label>

      <br><br>

      <button class="pink" onclick="addProduct()">
        ذخیره محصول
      </button>

    </div>

  </div>

</div>

</section>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
  supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function checkLogin(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    showDashboard();

  }

}

async function login(){

  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;

  const {error}=
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document.getElementById("loginError").textContent =
      "ایمیل یا رمز عبور اشتباه است.";

    return;
  }

  showDashboard();
}

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}

function showDashboard(){

  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";

  loadOrders();
  loadProducts();
}

function showTab(id,button){

  document.querySelectorAll(".panel")
    .forEach(x=>x.classList.remove("active"));

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  button.classList.add("active");
}

async function loadOrders(){

  const {data:orders,error}=
    await supabaseClient
      .from("orders")
      .select(`
        *,
        receipts(*)
      `)
      .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  const table=document.getElementById("ordersTable");

  table.innerHTML=(orders||[]).map((o,i)=>{

    const receipt=o.receipts?.[0];

    return `

      <tr>

        <td>${i+1}</td>

        <td>${escapeHtml(o.customer_name)}</td>

        <td>${escapeHtml(o.phone)}</td>

        <td>${Number(o.total).toLocaleString("fa-IR")} تومان</td>

        <td>
          <span class="status">
            ${escapeHtml(o.status)}
          </span>
        </td>

        <td>
          ${
            receipt
            ?
            `<a href="${receipt.image_url}" target="_blank">
              <img class="receipt" src="${receipt.image_url}">
            </a>`
            :
            "بدون رسید"
          }
        </td>

        <td>

          <button
            class="pink"
            onclick="approveOrder('${o.id}','${receipt?.id || ""}')">
            تأیید
          </button>

          <button
            class="danger"
            onclick="rejectOrder('${o.id}','${receipt?.id || ""}')">
            رد
          </button>

        </td>

      </tr>

    `;

  }).join("");

}

async function approveOrder(orderId,receiptId){

  await supabaseClient
    .from("orders")
    .update({
      status:"تأیید نهایی شده"
    })
    .eq("id",orderId);

  if(receiptId){

    await supabaseClient
      .from("receipts")
      .update({
        status:"تأیید شده"
      })
      .eq("id",receiptId);

  }

  loadOrders();

}

async function rejectOrder(orderId,receiptId){

  await supabaseClient
    .from("orders")
    .update({
      status:"پرداخت رد شده"
    })
    .eq("id",orderId);

  if(receiptId){

    await supabaseClient
      .from("receipts")
      .update({
        status:"رد شده"
      })
      .eq("id",receiptId);

  }

  loadOrders();

}

async function addProduct(){

  const product={

    name:document.getElementById("pName").value,
    category:document.getElementById("pCategory").value,
    price:Number(document.getElementById("pPrice").value),
    old_price:Number(document.getElementById("pOldPrice").value)||null,
    stock:Number(document.getElementById("pStock").value)||0,
    description:document.getElementById("pDescription").value,
    image_url:document.getElementById("pImage").value,
    is_new:document.getElementById("pNew").checked

  };

  if(!product.name || !product.price){

    alert("نام و قیمت محصول را وارد کن.");
    return;

  }

  const {error}=
    await supabaseClient
      .from("products")
      .insert(product);

  if(error){

    console.error(error);
    alert("محصول ذخیره نشد.");
    return;

  }

  alert("محصول با موفقیت اضافه شد 🎀");

  document.getElementById("pName").value="";
  document.getElementById("pPrice").value="";
  document.getElementById("pOldPrice").value="";
  document.getElementById("pStock").value="";
  document.getElementById("pDescription").value="";
  document.getElementById("pImage").value="";
  document.getElementById("pNew").checked=false;

  loadProducts();

}

async function loadProducts(){

  const {data,error}=
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  document.getElementById("productsList").innerHTML =
    (data||[]).map(p=>`

      <div class="product">

        <img src="${p.image_url || 'https://via.placeholder.com/500x500/FAD6E1/333333?text=LORA'}">

        <h3>${escapeHtml(p.name)}</h3>

        <p>${Number(p.price).toLocaleString("fa-IR")} تومان</p>

        <p>موجودی: ${p.stock}</p>

        <button
          class="danger"
          onclick="deleteProduct('${p.id}')">
          حذف محصول
        </button>

      </div>

    `).join("");

}

async function deleteProduct(id){

  if(!confirm("این محصول حذف شود؟")) return;

  const {error}=
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);

  if(error){

    alert("حذف محصول انجام نشد.");
    console.error(error);
    return;

  }

  loadProducts();

}

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

checkLogin();

</script>

</body>
  </html>
