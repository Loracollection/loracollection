
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LORA COLLECTION</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#ffffff;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */

header{
    width:100%;
    background:#fff;
    border-bottom:1px solid #f3e3e8;
    padding:25px 20px 18px;
    text-align:center;
}

/* LOGO */

.logo{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
}

.logo-symbol{
    position:relative;
    width:105px;
    height:105px;
    margin-bottom:5px;
}

/* L مشکی */

.black-l-vertical{
    position:absolute;
    width:5px;
    height:82px;
    background:#222;
    left:38px;
    top:5px;
}

.black-l-horizontal{
    position:absolute;
    width:58px;
    height:5px;
    background:#222;
    left:38px;
    top:82px;
}

/* L صورتی دست نویس */

.pink-l{
    position:absolute;
    left:49px;
    top:24px;
    color:#c9879d;
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:42px;
    font-weight:normal;
    transform:rotate(-5deg);
}

/* برگ کنار L */

.leaf{
    position:absolute;
    left:25px;
    top:35px;
    width:16px;
    height:28px;
    border:2px solid #c9879d;
    border-radius:100% 0 100% 0;
    transform:rotate(-35deg);
}

.leaf-line{
    position:absolute;
    left:31px;
    top:37px;
    width:2px;
    height:25px;
    background:#c9879d;
    transform:rotate(-35deg);
}

/* نوشته لوگو */

.logo-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    letter-spacing:6px;
    color:#222;
    margin-top:3px;
}

.logo-collection{
    font-family:Georgia,"Times New Roman",serif;
    font-size:10px;
    letter-spacing:5px;
    color:#c9879d;
    margin-top:5px;
}

/* MENU */

nav{
    margin-top:25px;
}

nav a{
    text-decoration:none;
    color:#444;
    font-size:13px;
    margin:0 12px;
}

nav a:hover{
    color:#c9879d;
}

/* HERO */

.hero{
    min-height:480px;
    background:#fff8fa;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
}

.hero-small{
    color:#c9879d;
    font-size:11px;
    letter-spacing:4px;
}

.hero h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:55px;
    letter-spacing:9px;
    margin:18px 0 10px;
}

.hero p{
    color:#777;
    font-size:16px;
    margin-bottom:30px;
}

.shop-button{
    display:inline-block;
    padding:14px 35px;
    background:#222;
    color:white;
    text-decoration:none;
    font-size:13px;
}

.shop-button:hover{
    background:#c9879d;
}

/* CATEGORIES */

.categories-section{
    padding:70px 20px;
    text-align:center;
}

.section-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    margin-bottom:10px;
}

.section-subtitle{
    color:#999;
    font-size:13px;
    margin-bottom:40px;
}

.categories{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.category{
    width:280px;
    height:230px;
    background:#fff4f7;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #f5e3e9;
}

.category:nth-child(2){
    background:#fff9fa;
}

.category:nth-child(3){
    background:#fdf0f4;
}

.category h3{
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    margin-bottom:10px;
}

.category p{
    color:#999;
    font-size:12px;
}

/* FOOTER */

footer{
    background:#fff8fa;
    text-align:center;
    padding:45px 20px;
    border-top:1px solid #f3e3e8;
}

.footer-logo{
    font-family:Georgia,"Times New Roman",serif;
    letter-spacing:4px;
    font-size:20px;
}

footer p{
    color:#999;
    font-size:12px;
    margin-top:10px;
}

/* MOBILE */

@media(max-width:600px){

    .logo-symbol{
        transform:scale(.9);
        margin-bottom:0;
    }

    nav{
        line-height:30px;
    }

    nav a{
        margin:0 7px;
    }

    .hero{
        min-height:430px;
    }

    .hero h1{
        font-size:42px;
        letter-spacing:6px;
    }

    .category{
        width:100%;
        max-width:330px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">

        <div class="logo-symbol">

            <div class="black-l-vertical"></div>
            <div class="black-l-horizontal"></div>

            <div class="pink-l">L</div>

            <div class="leaf"></div>
            <div class="leaf-line"></div>

        </div>

        <div class="logo-name">LORA</div>
        <div class="logo-collection">COLLECTION</div>

    </div>


    <nav>

        <a href="#">خانه</a>
        <a href="#">لباس</a>
        <a href="#">اکسسوری</a>
        <a href="#">آرایشی</a>
        <a href="#">تخفیف‌ها</a>

    </nav>

</header>


<section class="hero">

    <div>

        <div class="hero-small">
            NEW COLLECTION
        </div>

        <h1>LORA</h1>

        <p>
            ظرافت در سادگی
        </p>

        <a href="#" class="shop-button">
            مشاهده محصولات
        </a>

    </div>

</section>


<section class="categories-section">

    <h2 class="section-title">
        دسته‌بندی محصولات
    </h2>

    <p class="section-subtitle">
        انتخابی برای استایل خاص تو
    </p>


    <div class="categories">

        <div class="category">
            <div>
                <h3>لباس</h3>
                <p>استایل‌های خاص و شیک</p>
            </div>
        </div>


        <div class="category">
            <div>
                <h3>اکسسوری</h3>
                <p>جزئیات کوچک، تأثیر بزرگ</p>
            </div>
        </div>


        <div class="category">
            <div>
                <h3>لوازم آرایشی</h3>
                <p>زیبایی و مراقبت</p>
            </div>
        </div>

    </div>

</section>


<footer>

    <div class="footer-logo">
        LORA COLLECTION
    </div>

    <p>
        زیبایی در سادگی
    </p>

</footer>


</body>
                </html>
