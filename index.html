<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#fff;
    color:#222;
}

/* Header */
header{
    height:80px;
    border-bottom:1px solid #f1dce3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.menu{
    width:30px;
}

.menu span{
    display:block;
    height:2px;
    width:25px;
    background:#222;
    margin:5px 0;
}

.icons{
    display:flex;
    gap:18px;
    font-size:22px;
}

.header-logo{
    text-align:center;
}

/* لوگوی L */
.l-logo{
    position:relative;
    width:60px;
    height:45px;
    margin:auto;
}

.l-black{
    position:absolute;
    left:7px;
    top:-8px;
    font-family:Georgia,serif;
    font-size:58px;
    font-weight:bold;
}

.l-pink{
    position:absolute;
    left:23px;
    top:7px;
    font-family:cursive;
    font-size:42px;
    color:#d58ca2;
}

/* نام زیر لوگو */
.logo-title{
    font-family:Georgia,serif;
    font-size:9px;
    letter-spacing:3px;
}

/* صفحه اصلی */
.hero{
    min-height:520px;
    background:#fff7f9;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
}

/* لوگوی اصلی */
.main-logo{
    margin-bottom:28px;
}

.main-logo-top{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    height:65px;
}

.bow{
    font-size:18px;
}

.main-l-black{
    font-family:Georgia,serif;
    font-size:65px;
    font-weight:bold;
    line-height:1;
}

.main-l-pink{
    font-family:cursive;
    font-size:48px;
    color:#d58ca2;
    margin-left:-27px;
    margin-top:12px;
}

.main-logo-name{
    font-family:Georgia,serif;
    font-size:13px;
    letter-spacing:4px;
    margin-top:4px;
}

/* شعار */
.slogan{
    font-family:Georgia,serif;
    font-size:20px;
    line-height:2.2;
    color:#444;
}

/* دکمه */
.button{
    display:inline-block;
    margin-top:30px;
    background:#222;
    color:#fff;
    text-decoration:none;
    padding:13px 35px;
    font-size:13px;
}

/* بخش ها */
section{
    padding:65px 20px;
}

.section-title{
    text-align:center;
    font-family:Georgia,serif;
    font-size:28px;
    margin-bottom:35px;
}

/* دسته بندی */
.categories{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.category{
    height:170px;
    background:#fff8fa;
    border:1px solid #f0dce3;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.category-icon{
    font-size:35px;
    margin-bottom:12px;
}

.category-name{
    font-family:Georgia,serif;
    font-size:17px;
}
