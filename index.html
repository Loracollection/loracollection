<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LORA COLLECTION | فروشگاه آنلاین</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

:root{
    --pink:#F7B6C2;
    --pink2:#FAD6E1;
    --pink3:#FFF5F7;
    --pink4:#FDE8EE;
    --dark:#333333;
    --gray:#777;
    --white:#ffffff;
    --border:#f2dce2;
    --shadow:0 5px 20px rgba(220,130,155,.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:#fff;
    color:var(--dark);
    line-height:1.8;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

/* ================= HEADER ================= */

.topbar{
    background:var(--pink3);
    border-bottom:1px solid var(--border);
    height:38px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    color:#666;
}

.header{
    background:#fff;
    border-bottom:1px solid #f5e4e8;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1250px;
    margin:auto;
    height:88px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
    padding:0 20px;
}

/* LOGO NUMBER 1 */

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:190px;
}

.logo-symbol{
    position:relative;
    width:52px;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-L{
    font-family:Georgia,serif;
    font-size:64px;
    font-weight:400;
    line-height:1;
    color:#222;
    position:absolute;
    top:-3px;
    left:7px;
}

.logo-branch{
    position:absolute;
    left:0;
    top:11px;
    color:#8c7a76;
    font-size:25px;
    transform:rotate(-20deg);
}

.logo-heart{
    position:absolute;
    right:-1px;
    bottom:7px;
    color:#e989a2;
    font-size:11px;
}

.logo-text{
    display:flex;
    flex-direction:column;
    line-height:1;
}

.logo-text strong{
    font-family:Georgia,serif;
    font-size:24px;
    letter-spacing:4px;
    font-weight:500;
}

.logo-text span{
    color:#d98da0;
    font-size:9px;
    letter-spacing:3px;
    margin-top:7px;
    text-align:center;
}

/* NAV */

.nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex:1;
}

.nav a{
    font-size:13px;
    transition:.25s;
    white-space:nowrap;
}

.nav a:hover,
.nav a.active{
    color:#e87898;
}

/* HEADER TOOLS */

.header-tools{
    display:flex;
    align-items:center;
    gap:12px;
}

.search{
    width:220px;
    height:42px;
    border:1px solid #f0dfe4;
    background:#fff8fa;
    border-radius:8px;
    display:flex;
    align-items:center;
    padding:0 13px;
}

.search input{
    width:100%;
    border:0;
    outline:none;
    background:transparent;
    font-size:12px;
}

.search button{
    border:0;
    background:none;
    cursor:pointer;
    color:#d97e98;
}

.icon-btn{
    width:39px;
    height:39px;
    border:1px solid #f2dce2;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    color:#555;
    transition:.2s;
}

.icon-btn:hover{
    background:var(--pink3);
    color:#e87998;
}

.cart-count{
    position:absolute;
    background:#ed7192;
    color:white;
    width:17px;
    height:17px;
    border-radius:50%;
    font-size:9px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:-42px 0 0 22px;
}

/* MOBILE MENU */

.menu-toggle{
    display:none;
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
}

/* ================= HERO ================= */

.container{
    max-width:1250px;
    margin:auto;
    padding:0 20px;
}

.hero{
    margin-top:22px;
    height:300px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(90deg,rgba(255,226,234,.98) 0%,rgba(255,224,232,.90) 43%,rgba(255,240,244,.25) 100%),
        url("https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=1400&q=85");
    background-size:cover;
    background-position:center;
    border:1px solid #f2d6df;
}

.hero-content{
    position:absolute;
    right:7%;
    top:50%;
    transform:translateY(-50%);
    width:43%;
}

.hero-small{
    color:#dc8aa0;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.hero h1{
    color:#c94870;
    font-size:38px;
    margin-bottom:8px;
    font-weight:700;
}

.hero p{
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}

.btn{
    border:0;
    background:#ec7193;
    color:white;
    padding:11px 24px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

.btn:hover{
    background:#dc5d82;
    transform:translateY(-2px);
}

.hero-dots{
    position:absolute;
    bottom:13px;
    left:50%;
    display:flex;
    gap:6px;
}

.hero-dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    border:1px solid #e99aae;
}

.hero-dots span.active{
    background:#ed7192;
}

/* ================= BENEFITS ================= */

.benefits{
    margin-top:18px;
    background:#fff;
    border:1px solid #f1dfe4;
    border-radius:12px;
    box-shadow:var(--shadow);
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.benefit{
    padding:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    border-left:1px solid #f2e4e7;
}

.benefit:last-child{
    border-left:0;
}

.benefit-icon{
    color:#ed83a0;
    font-size:26px;
}

.benefit strong{
    display:block;
    font-size:13px;
}

.benefit span{
    font-size:10px;
    color:#888;
}

/* ================= TITLES ================= */

.section{
    padding:45px 0 0;
}

.section-title{
    text-align:center;
    margin-bottom:28px;
}

.section-title h2{
    font-size:21px;
    font-weight:600;
}

.section-title p{
    color:#aaa;
    font-size:11px;
    margin-top:3px;
}

.section-title:after{
    content:"";
    display:block;
    width:45px;
    height:2px;
    background:#ee88a3;
    margin:9px auto 0;
}

/* ================= CATEGORIES ================= */

.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.category{
    min-height:145px;
    border:1px solid #f2dfe4;
    border-radius:10px;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:.25s;
    box-shadow:var(--shadow);
}

.category:hover{
    transform:translateY(-5px);
    border-color:#ef9db2;
    box-shadow:0 10px 30px rgba(230,120,150,.15);
}

.category .cat-icon{
    font-size:34px;
    color:#ed83a0;
    margin-bottom:6px;
}

.category h3{
    font-size:13px;
    font-weight:500;
}

.category .btn{
    padding:6px 18px;
    margin-top:8px;
    font-size:10px;
}

.new{
    position:absolute;
    top:10px;
    left:10px;
    background:#ed7192;
    color:#fff;
    font-size:9px;
    padding:3px 9px;
    border-radius:12px;
}

/* ================= PROMO ================= */

.promo-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.promo{
    height:180px;
    border-radius:12px;
    padding:30px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    background:var(--pink3);
    border:1px solid #f3dce3;
}

.promo h3{
    color:#c94e72;
    font-size:21px;
}

.promo p{
    color:#666;
    font-size:11px;
    max-width:280px;
    margin:5px 0 12px;
}

.promo img{
    position:absolute;
    left:0;
    bottom:0;
    height:100%;
    width:50%;
    object-fit:cover;
    mix-blend-mode:multiply;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.product{
    background:#fff;
    border:1px solid #f0dfe4;
    border-radius:10px;
    overflow:hidden;
    transition:.25s;
    position:relative;
}

.product:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(220,120,150,.12);
}

.product-img{
    height:245px;
    background:#fff4f6;
    overflow:hidden;
    position:relative;
}

.product-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.product:hover img{
    transform:scale(1.04);
}

.product-info{
    padding:13px;
}

.product-info h3{
    font-size:13px;
    margin-bottom:5px;
}

.price{
    color:#dc6687;
    font-size:13px;
    font-weight:600;
}

.old-price{
    color:#aaa;
    text-decoration:line-through;
    font-size:10px;
    margin-right:6px;
}

.product-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.add-cart{
    background:#ed7192;
    color:#fff;
    border:0;
    border-radius:5px;
    padding:7px 12px;
    cursor:pointer;
    font-size:10px;
}

.favorite{
    border:0;
    background:none;
    color:#e989a2;
    font-size:20px;
    cursor:pointer;
}

/* ================= ABOUT ================= */

.about{
    margin-top:45px;
    background:var(--pink3);
    border:1px solid #f2dce2;
    border-radius:14px;
    padding:35px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
    align-items:center;
}

.about h2{
    color:#c84d70;
    margin-bottom:12px;
}

.about p{
    font-size:12px;
    color:#666;
    line-height:2.2;
}

.about-img{
    height:250px;
    border-radius:12px;
    overflow:hidden;
}

.about-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= CLUB ================= */

.club{
    margin-top:45px;
    background:linear-gradient(135deg,#fff4f7,#fbd6e1);
    border-radius:14px;
    padding:30px;
    text-align:center;
}

.club h2{
    color:#c84d70;
}

.club p{
    font-size:12px;
    color:#777;
    margin:5px 0 15px;
}

.club-form{
    display:flex;
    max-width:550px;
    margin:auto;
    gap:7px;
}

.club-form input{
    flex:1;
    border:1px solid #eccfd8;
    background:#fff;
    border-radius:5px;
    padding:10px;
    outline:none;
    font-size:11px;
}

/* ================= TRACKING ================= */

.tracking{
    margin-top:40px;
    padding:30px;
    border:1px solid #f1dfe4;
    border-radius:12px;
    text-align:center;
}

.tracking input{
    width:300px;
    max-width:100%;
    padding:10px;
    border:1px solid #e8d5da;
    border-radius:5px;
    margin:12px 5px;
    outline:none;
}

/* ================= FAQ ================= */

.faq{
    max-width:850px;
    margin:auto;
}

.faq-item{
    border:1px solid #f0dce2;
    border-radius:8px;
    margin-bottom:9px;
    overflow:hidden;
}

.faq-question{
    width:100%;
    border:0;
    background:#fff;
    padding:14px 18px;
    text-align:right;
    cursor:pointer;
    font-size:12px;
    display:flex;
    justify-content:space-between;
}

.faq-answer{
    display:none;
    padding:0 18px 15px;
    font-size:11px;
    color:#777;
    background:#fffafd;
}

.faq-item.open .faq-answer{
    display:block;
}

/* ================= CONTACT ================= */

.contact{
    margin-top:45px;
    background:#fff;
    border-top:1px solid #f1dfe4;
    padding:35px 0;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.contact-box h3{
    font-size:14px;
    margin-bottom:12px;
    color:#444;
}

.contact-box p,
.contact-box a{
    display:block;
    font-size:11px;
    color:#777;
    margin-bottom:6px;
}

.socials{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.social{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#fde6ec;
    color:#df7592;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

/* ================= FOOTER ================= */

.footer{
    background:#f7b6c8;
    color:#fff;
    text-align:center;
    padding:20px;
}

.footer-logo{
    font-family:Georgia,serif;
    font-size:21px;
    letter-spacing:4px;
}

.footer p{
    font-size:10px;
    margin-top:4px;
}

.copyright{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.35);
    font-size:10px;
}

/* ================= CART ================= */

.cart-panel{
    position:fixed;
    top:0;
    left:-400px;
    width:380px;
    max-width:90%;
    height:100vh;
    background:#fff;
    z-index:3000;
    box-shadow:5px 0 25px rgba(0,0,0,.15);
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.cart-panel.open{
    left:0;
}

.cart-header{
    height:70px;
    padding:0 20px;
    border-bottom:1px solid #f0dce2;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cart-header button{
    border:0;
    background:none;
    font-size:22px;
    cursor:pointer;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:15px;
}

.cart-item{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #f3e4e8;
}

.cart-item img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:6px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h4{
    font-size:11px;
}

.cart-item-info p{
    color:#e26d8c;
    font-size:10px;
}

.cart-remove{
    border:0;
    background:none;
    color:#d66b86;
    cursor:pointer;
}

.cart-footer{
    padding:18px;
    border-top:1px solid #f0dce2;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .nav{
        gap:15px;
    }

    .search{
        width:150px;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){

    .topbar{
        font-size:9px;
    }

    .header-inner{
        height:70px;
    }

    .menu-toggle{
        display:block;
    }

    .nav{
        position:fixed;
        top:70px;
        right:-100%;
        width:280px;
        height:calc(100vh - 70px);
        background:#fff;
        flex-direction:column;
        align-items:flex-start;
        padding:25px;
        box-shadow:-5px 5px 20px rgba(0,0,0,.08);
        transition:.3s;
    }

    .nav.open{
        right:0;
    }

    .nav a{
        width:100%;
        padding:10px;
        border-bottom:1px solid #f4e5e9;
    }

    .logo{
        min-width:auto;
    }

    .logo-text strong{
        font-size:18px;
    }

    .logo-symbol{
        transform:scale(.8);
        margin-left:-7px;
    }

    .search{
        display:none;
    }

    .hero{
        height:350px;
        background-position:60% center;
    }

    .hero-content{
        width:90%;
        right:5%;
        top:50%;
    }

    .hero h1{
        font-size:29px;
    }

    .benefits{
        grid-template-columns:repeat(2,1fr);
    }

    .benefit{
        border-bottom:1px solid #f2e4e7;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .promo-grid{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .product-img{
        height:210px;
    }

    .about{
        grid-template-columns:1fr;
    }

    .contact-grid{
        grid-template-columns:1fr;
        text-align:center;
    }

    .socials{
        justify-content:center;
    }

    .club-form{
        flex-direction:column;
    }
}

@media(max-width:450px){

    .container{
        padding:0 12px;
    }

    .categories{
        gap:8px;
    }

    .category{
        min-height:125px;
    }

    .products{
        gap:8px;
    }

    .product-img{
        height:175px;
    }

    .hero{
        margin-top:12px;
    }

    .hero h1{
        font-size:25px;
    }

    .hero p{
        font-size:11px;
    }

    .benefit{
        padding:12px 5px;
    }

    .benefit-icon{
        font-size:20px;
    }

    .benefit strong{
        font-size:10px;
    }

    .benefit span{
        font-size:8px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    ارسال سریع به سراسر کشور ✦ پشتیبانی آنلاین ✦ ضمانت اصالت کالا
</div>

<!-- HEADER -->
<header class="header">

<div class="header-inner">

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<!-- LOGO -->
<a href="#home" class="logo">

    <div class="logo-symbol">
        <span class="logo-branch">❧</span>
        <span class="logo-L">L</span>
        <span class="logo-heart">
