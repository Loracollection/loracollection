<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#fff;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */
header{
    background:#fff;
    text-align:center;
    padding:35px 15px 22px;
    border-bottom:1px solid #f2dfe6;
}

/* LOGO */
.logo-mark{
    position:relative;
    width:180px;
    height:155px;
    margin:auto;
}

/* L بزرگ مشکی */
.black-l-vertical{
    position:absolute;
    left:78px;
    top:5px;
    width:6px;
    height:115px;
    background:#222;
}

.black-l-horizontal{
    position:absolute;
    left:78px;
    top:115px;
    width:78px;
    height:6px;
    background:#222;
}

/* L صورتی
   پایین آن روی خط افقی L مشکی قرار می‌گیرد */
.pink-l{
    position:absolute;
    left:88px;
    top:48px;
    z-index:2;

    color:#d58ca2;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:82px;
    font-weight:normal;
    line-height:.8;

    transform:rotate(-7deg);
}

/* نام برند */
.brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
}

.bow{
    font-size:24px;
    line-height:1;
}

.brand-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    letter-spacing:7px;
    color:#222;
}

.brand-sub{
    font-family:Georgia,"Times New Roman",serif;
    font-size:10px;
    letter-spacing:5px;
    color:#d58ca2;
    margin-top:5px;
}

/* MENU */
nav{
    margin-top:25px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
}

nav a{
    text-decoration:none;
    color:#444;
    font-size:13px;
}

/* HERO */
.hero{
    min-height:460px;
    background:#fff7fa;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}

.hero-small{
    color:#d58ca2;
    font-size:11px;
    letter-spacing:4px;
}

.hero h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:58px;
    letter-spacing:9px;
    margin:18px 0 12px;
}

.hero p{
    color:#777;
    margin-bottom:30px;
}

.button{
    display:inline-block;
    background:#222;
    color:#fff;
    text-decoration:none;
    padding:14px 38px;
    font-size:13px;
}

/* CATEGORIES */
.categories-section{
    padding:70px 20px;
    text-align:center;
}

.categories-section h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:29px;
    margin-bottom:10px;
}

.categories-section>p{
    color:#999;
    font-size:13px;
    margin-bottom:40px;
}

.categories{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.category{
    width:280px;
    height:210px;
    background:#fff4f7;
    border:1px solid #f2dfe6;
    display:flex;
    align-items:center;
    justify-content:center;
}

.category h3{
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    margin-bottom:10px;
}

.category p{
    color:#999;
    font-size:12px;
}

/* FOOTER */
footer{
    background:#fff7fa;
    text-align:center;
    padding:40px 20px;
    border-top:1px solid #f2dfe6;
}

footer strong{
    font-family:Georgia,"Times New Roman",serif;
    letter-spacing:4px;
}

footer p{
    color:#999;
    font-size:12px;
    margin-top:8px;
}

/* MOBILE */
@media(max-width:600px){

    .logo-mark{
        transform:scale(.85);
        margin-bottom:-8px;
    }

    .brand-name{
        font-size:23px;
        letter-spacing:5px;
    }

    .bow{
        font-size:20px;
    }

    nav{
        gap:8px;
    }

    nav a{
        font-size:12px;
    }

    .hero{
        min-height:410px;
    }

    .hero h1{
        font-size:43px;
        letter-spacing:6px;
    }

    .category{
        width:100%;
        max-width:330px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo-mark">

        <!-- L مشکی -->
        <div class="black-l-vertical"></div>
        <div class="black-l-horizontal"></div>

        <!-- L صورتی -->
        <div class="pink-l">L</div>

    </div>

    <!-- LORA COLLECTION با پاپیون دو طرف -->
    <div class="brand">

        <span class="bow">🎀</span>

        <div>
            <div class="brand-name">LORA</div>
            <div class="brand-sub">COLLECTION</div>
        </div>

        <span class="bow">🎀</span>

    </div>

    <nav>
        <a href="#">خانه</a>
        <a href="#">لباس</a>
        <a href="#">اکسسوری</a>
        <a href="#">لوازم آرایشی</a>
        <a href="#">تخفیف‌ها</a>
    </nav>

</header>

<section class="hero">

    <div>

        <div class="hero-small">NEW COLLECTION</div>

        <h1>LORA</h1>

        <p>ظرافت در سادگی</p>

        <a href="#" class="button">
            مشاهده محصولات
        </a>

    </div>

</section>

<section class="categories-section">

    <h2
