<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#fff;
    color:#292629;
}

/* ================= HEADER ================= */

header{
    height:85px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#fff;
    border-bottom:1px solid #f2dfe6;
    position:sticky;
    top:0;
    z-index:1000;
}

/* سه خط */

.menu-button{
    width:42px;
    height:42px;
    border:none;
    background:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
}

.menu-button span{
    display:block;
    width:27px;
    height:2px;
    background:#292629;
}

/* لوگوی موقت */

.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.logo-name{
    font-family:Georgia,serif;
    font-size:25px;
    letter-spacing:5px;
}

.logo-sub{
    color:#d58ca2;
    font-family:Georgia,serif;
    font-size:9px;
    letter-spacing:4px;
    margin-top:4px;
}

    gap:18px;
}
