<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORA COLLECTION</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#fff;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */
header{
    text-align:center;
    padding:30px 15px 22px;
    border-bottom:1px solid #f1dfe6;
    background:#fff;
}

/* LOGO */
.logo{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo-mark{
    position:relative;
    width:210px;
    height:165px;
    margin:auto;
}

/* L بزرگ مشکی */
.black-l{
    position:absolute;
    left:92px;
    top:8px;
    width:6px;
    height:120px;
    background:#222;
}

.black-l-bottom{
    position:absolute;
    left:92px;
    top:122px;
    width:85px;
    height:6px;
    background:#222;
}

/* L صورتی دست نویس
   پایین L روی خط مشکی قرار می‌گیرد */
.pink-l{
    position:absolute;
    left:99px;
    top:54px;
    z-index:5;

    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:82px;
    font-weight:normal;
    line-height:.8;

    color:#d58ca2;
    transform:rotate(-7deg);
}

/* شاخه صورتی از بالای L به سمت چپ */
.branch{
    position:absolute;
    left:30px;
    top:18px;
    width:105px;
    height:75px;
    z-index:4;
    transform:rotate(-8deg);
}

/* ساقه */
.branch-stem{
    position:absolute;
    right:2px;
    top:48px;
    width:105px;
    height:2px;
    background:#d58ca2;
    transform:rotate(-24deg);
    transform-origin:right center;
}

/* برگ‌ها */
.branch-leaf{
    position:absolute;
    width:32px;
    height:13px;
    border:2px solid #d58ca2;
    border-radius:100% 0 100% 0;
    background:#fff;
}

.leaf-a{
    right:62px;
    top:24px;
    transform:rotate(25deg);
}

.leaf-b{
    right:43px;
    top:13px;
    transform:rotate(-35deg);
}

.leaf-c{
    right:27px;
    top:35px;
    transform:rotate(28deg);
}

.leaf-d{
    right:7px;
    top:25px;
    transform:rotate(-38deg);
}

/* رگبرگ ظریف */
.branch-leaf::after{
    content:"";
    position:absolute;
    left:4px;
    top:5px;
    width:23px;
    height:1px;
    background:#d58ca2;
}

/* نام برند */
.brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:-2px;
}

.bow{
    font-size:25px;
}

.brand-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    letter-spacing:7px;
}

.brand-sub{
    font-family:Georgia,"Times New Roman",serif;
    color:#d58ca2;
    font-size:10px;
    letter-spacing:5px;
    margin-top:5px;
}

/* MENU */
nav{
    margin-top:25px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
}

nav a{
    text-decoration:none;
    color:#444;
    font-size:13px;
}

/* HERO */
.hero{
    min-height:460px;
    background:#fff7fa;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero-small{
    color:#d58ca2;
    letter-spacing:4px;
    font-size:11px;
}

.hero h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:58px;
    letter-spacing:9px;
    margin:18px 0 12px;
}

.hero p{
    color:#777;
    margin-bottom:30px;
}

.button{
    display:inline-block;
    padding:14px 38px;
    background:#222;
    color:#fff;
    text-decoration:none;
    font-size:13px;
}

/* CATEGORIES */
.categories-section{
    padding:70px 20px;
    text-align:center;
}

.categories-section h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:29px;
    margin-bottom:10px;
}

.categories-section>p{
    color:#999;
    font-size:13px;
    margin-bottom:40px;
}

.categories{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.category{
    width:280px;
    height:210px;
    background:#fff4f7;
    border:1px solid #f1dfe6;
    display:flex;
    align-items:center;
    justify-content:center;
}

.category h3{
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    margin-bottom:10px;
}

.category p{
    color:#999;
    font-size:12px;
}

/* FOOTER */
footer{
    background:#fff7fa;
    text-align:center;
    padding:40px 20px;
    border-top:1px solid #f1dfe6;
}

footer strong{
    font-family:Georgia,"Times New Roman",serif;
    letter-spacing:4px;
}

footer p{
    color:#999;
    font-size:12px;
    margin-top:8px;
}

/* MOBILE */
@media(max-width:600px){

    .logo-mark{
        transform:scale(.85);
        margin-bottom:-8px;
    }

    .brand-name{
        font-size:23px;
        letter-spacing:5px;
    }

    .bow{
        font-size:20px;
    }

    nav{
        gap:8px;
    }

    nav a{
        font-size:12px;
    }

    .hero{
        min-height:410px;
    }

    .hero h1{
        font-size:43px;
        letter-spacing:6px;
    }

    .category{
        width:100%;
        max-width:330px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">

    <div class="logo-mark">

        <!-- L مشکی -->
        <div class="black-l"></div>
        <div class="black-l-bottom"></div>

        <!-- L صورتی -->
        <div class="pink-l">L</div>

        <!-- شاخه ظریف صورتی -->
        <div class="branch">

            <div class="branch-stem"></div>

            <div class="branch-leaf leaf-a"></div>
            <div class="branch-leaf leaf-b"></div>
            <div class="branch-leaf leaf-c"></div>
            <div class="branch-leaf leaf-d"></div>

        </div>

    </div>

    <!-- پاپیون‌ها -->
    <div class="brand">

        <span class="bow">🎀</span>

        <div>
            <div class="brand-name">LORA</div>
            <div class="brand-sub">COLLECTION</div>
        </div>

        <span class="bow">🎀</span>

    </div>

</div>

<nav>
    <a href="#">خانه</a>
    <a href="#">لباس</a>
    <a href="#">اکسسوری</a>
    <a href="#">لوازم آرایشی</a>
    <a href="#">تخفیف‌ها</a>
</nav>

</header>


<section class="hero">

<div>

    <div class="hero-small">NEW COLLECTION</div>

    <h1>LORA</h1>

    <p>ظرافت در سادگی</p>

    <a href="#" class="button">مشاهده محصولات</a>

</div>

</section>


<section class="categories-section">

<h2>دسته‌بندی محصولات</h2>

<p>انتخابی برای استایل خاص تو</p>

<div class="categories">

<div class="category">
    <div>
        <h3>لباس</h3>
        <p>استایل‌های خاص و شیک</p>
    </div>
</div>

<div class="category">
    <div>
        <h3>اکسسوری</h3>
        <p>جزئیات کوچک، تأثیر بزرگ</p>
    </div>
</div>

<div class="category">
    <div>
        <h3>لوازم آرایشی</h3>
        <p>زیبایی و مراقبت</p>
    </div>
</div>

</div>

</section>


<footer>

<strong>LORA COLLECTION</strong>

<p>زیبایی در سادگی</p>

</footer>

</body>
    </html>
