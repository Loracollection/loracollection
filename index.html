<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#fff;
    color:#333;
}

header{
    background:#fff;
    border-bottom:1px solid #f3dfe7;
    padding:20px;
    text-align:center;
}

.logo{
    font-family:Georgia,serif;
    font-size:32px;
    letter-spacing:5px;
    color:#333;
}

.subtitle{
    color:#c98b9f;
    font-size:12px;
    letter-spacing:3px;
    margin-top:6px;
}

nav{
    margin-top:20px;
}

nav a{
    color:#555;
    text-decoration:none;
    margin:0 10px;
    font-size:14px;
}

.hero{
    min-height:500px;
    background:#fff7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.hero small{
    color:#c98b9f;
    letter-spacing:3px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:58px;
    letter-spacing:8px;
    margin:20px 0 10px;
}

.hero p{
    color:#777;
    font-size:17px;
    margin-bottom:30px;
}

.button{
    display:inline-block;
    background:#333;
    color:white;
    padding:14px 35px;
    text-decoration:none;
    font-size:14px;
}

.section{
    padding:70px 20px;
    text-align:center;
}

.section h2{
    font-family:Georgia,serif;
    font-size:30px;
    margin-bottom:10px;
}

.section > p{
    color:#999;
    margin-bottom:40px;
}

.categories{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.category{
    width:280px;
    height:220px;
    background:#fdf0f4;
    display:flex;
    align-items:center;
    justify-content:center;
}

.category h3{
    font-family:Georgia,serif;
    font-size:25px;
    margin-bottom:8px;
}

.category p{
    color:#888;
    font-size:13px;
}

footer{
    background:#fff7fa;
    text-align:center;
    padding:40px 20px;
    color:#888;
}

footer strong{
    font-family:Georgia,serif;
    color:#333;
    letter-spacing:3px;
}

@media(max-width:600px){
    .hero h1{
        font-size:42px;
    }

    nav a{
        display:inline-block;
        margin:7px;
    }

    .category{
        width:100%;
        max-width:320px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">LORA</div>
    <div class="subtitle">COLLECTION</div>

    <nav>
        <a href="#">خانه</a>
        <a href="#">لباس</a>
        <a href="#">اکسسوری</a>
        <a href="#">آرایشی</a>
        <a href="#">تخفیف‌ها</a>
    </nav>
</header>

<section class="hero">
    <div>
        <small>NEW COLLECTION</small>
        <h1>LORA</h1>
        <p>ظرافت در سادگی</p>
        <a class="button" href="#">مشاهده محصولات</a>
    </div>
</section>

<section class="section">
    <h2>دسته‌بندی محصولات</h2>
    <p>انتخابی برای استایل خاص تو</p>

    <div class="categories">

        <div class="category">
            <div>
                <h3>لباس</h3>
                <p>استایل‌های خاص و شیک</p>
            </div>
        </div>

        <div class="category">
            <div>
                <h3>اکسسوری</h3>
                <p>جزئیات کوچک، تأثیر بزرگ</p>
            </div>
        </div>

        <div class="category">
            <div>
                <h3>لوازم آرایشی</h3>
                <p>زیبایی و مراقبت</p>
            </div>
        </div>

    </div>
</section>

<footer>
    <strong>LORA COLLECTION</strong>
    <p>زیبایی در سادگی</p>
</footer>

</body>
  </html>
