<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#fff;
    color:#292629;
}

/* HEADER */
header{
    height:85px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#fff;
    border-bottom:1px solid #f2dfe6;
    position:sticky;
    top:0;
    z-index:1000;
}

/* MENU */
.menu-button{
    width:42px;
    height:42px;
    border:none;
    background:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
}

.menu-button span{
    display:block;
    width:27px;
    height:2px;
    background:#292629;
}

/* LOGO L */
.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.logo-mark{
    position:relative;
    width:58px;
    height:48px;
    margin:auto;
}

.logo-L{
    position:absolute;
    left:5px;
    top:0;
    font-family:Georgia,serif;
    font-size:52px;
    line-height:45px;
    font-weight:bold;
    color:#292629;
}

.logo-pink-L{
    position:absolute;
    left:18px;
    top:10px;
    font-family:cursive;
    font-size:39px;
    line-height:35px;
    color:#d58ca2;
    font-weight:normal;
}

/* LORA COLLECTION زیر لوگو */
.logo-text{
    margin-top:2px;
    font-family:Georgia,serif;
    font-size:9px;
    letter-spacing:3px;
    color:#292629;
}

/* ICONS */
.header-icons{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon-button{
    border:none;
    background:none;
    cursor:pointer;
    font-size:23px;
    color:#292629;
    position:relative;
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-8px;
    background:#d58ca2;
    color:#fff;
    width:17px;
    height:17px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* SIDE MENU */
.side-menu{
    position:fixed;
    top:0;
    left:-300px;
    width:280px;
    height:100vh;
    background:#fff;
    box-shadow:5px 0 20px rgba(0,0,0,.08);
    z-index:2000;
    transition:.35s;
    padding:30px 25px;
}

.side-menu.open{
    left:0;
}

.close-menu{
    border:none;
    background:none;
    font-size:30px;
    cursor:pointer;
    margin-bottom:25px;
}

.side-menu a{
    display:block;
    text-decoration:none;
    color:#333;
    font-size:15px;
    padding:17px 5px;
    border-bottom:1px solid #f5e5eb;
}

.side-menu a:hover{
    color:#d58ca2;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:1500;
    display:none;
}

.overlay.show{
    display:block;
}

/* SEARCH */
.search-box{
    display:none;
    padding:15px 20px;
    background:#fff8fa;
    border-bottom:1px solid #f2dfe6;
}

.search-box.show{
    display:block;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ead4dc;
    outline:none;
    font-family:Tahoma;
}

.search-box input:focus{
    border-color:#d58ca2;
}

/* HERO */
.hero{
    min-height:520px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 20px;
    background:linear-gradient(135deg,#fffafb,#fff2f6);
}

.hero-small{
    color:#d58ca2;
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:25px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:52px;
    letter-spacing:6px;
    margin-bottom:28px;
}

.hero-slogan{
    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    line-height:2;
    color:#444;
    margin-bottom:30px;
}

.hero-button{
    display:inline-block;
    padding:14px 38px;
    background:#292629;
    color:#fff;
    text-decoration:none;
    font-size:13px;
}

.hero-button:hover{
    background:#d58ca2;
}

/* SECTIONS */
.section{
    padding:70px 20px;
}

.section-title{
    text-align:center;
    font-family:Georgia,serif;
    font-size:30px;
    margin-bottom:12px;
}

.section-subtitle{
    text-align:center;
    color:#999;
