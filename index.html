<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORA COLLECTION</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#fff;
    color:#292629;
}

/* HEADER */
header{
    height:85px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#fff;
    border-bottom:1px solid #f2dfe6;
    position:sticky;
    top:0;
    z-index:1000;
}

/* MENU BUTTON */
.menu-button{
    width:42px;
    height:42px;
    border:none;
    background:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
}

.menu-button span{
    display:block;
    width:27px;
    height:2px;
    background:#292629;
}

/* LOGO */
.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.logo-name{
    font-family:Georgia,serif;
    font-size:25px;
    letter-spacing:5px;
}

.logo-sub{
    color:#d58ca2;
    font-family:Georgia,serif;
    font-size:9px;
    letter-spacing:4px;
    margin-top:4px;
}

/* HEADER ICONS */
.header-icons{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon-button{
    border:none;
    background:none;
    cursor:pointer;
    font-size:23px;
    color:#292629;
    position:relative;
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-8px;
    background:#d58ca2;
    color:#fff;
    width:17px;
    height:17px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* SIDE MENU */
.side-menu{
    position:fixed;
    top:0;
    left:-300px;
    width:280px;
    height:100vh;
    background:#fff;
    box-shadow:5px 0 20px rgba(0,0,0,.08);
    z-index:2000;
    transition:.35s;
    padding:30px 25px;
}

.side-menu.open{
    left:0;
}

.close-menu{
    border:none;
    background:none;
    font-size:30px;
    cursor:pointer;
    margin-bottom:25px;
}

.side-menu a{
    display:block;
    text-decoration:none;
    color:#333;
    font-size:15px;
    padding:17px 5px;
    border-bottom:1px solid #f5e5eb;
}

.side-menu a:hover{
    color:#d58ca2;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:1500;
    display:none;
}

.overlay.show{
    display:block;
}

/* SEARCH */
.search-box{
    display:none;
    padding:15px 20px;
    background:#fff8fa;
    border-bottom:1px solid #f2dfe6;
}

.search-box.show{
    display:block;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ead4dc;
    outline:none;
    font-family:Tahoma;
}
